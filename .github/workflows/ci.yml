name: Demo App CI
on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build Go image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Linting and Formatting
        uses: golangci/golangci-lint-action@v9

      - name: Run tests
        run: go test ./... -v

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          push: false
          load: true
          context: .
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/devops-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha, mode=max

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'docker.io/${{ secrets.DOCKERHUB_USERNAME }}/devops-app:${{ github.sha }}'
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Docker image
        run: docker push docker.io/${{ secrets.DOCKERHUB_USERNAME }}/devops-app:${{ github.sha }}     
      
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/devops-app:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0

      - name: Sign SBOM attestation
        run: |
          cosign attest \
            --yes \
            --type cyclonedx \
            --predicate sbom.json \
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/devops-app:${{ github.sha }}

      - name: Sign image
        run: |
          cosign sign \
            --yes \
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/devops-app:${{ github.sha }}

      - name: Verify image signature
        run: | 
          cosign verify \
            --certificate-identity-regexp "^https://github\.com/Aron-dxd/devops-app/\.github/workflows/ci\.yml@refs/heads/main$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/devops-app:${{ github.sha }}
      
      - name: Verify SBOM attestation
        run: |
          cosign verify-attestation \
            --type cyclonedx \
            --certificate-identity-regexp "^https://github\.com/Aron-dxd/devops-app/\.github/workflows/ci\.yml@refs/heads/main$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/devops-app:${{ github.sha }}
